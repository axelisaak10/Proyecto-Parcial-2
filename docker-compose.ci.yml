services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "80"
      DB_PATH: /app/data/toystore.db
      BACKUP_DIR: /app/backups
      JWT_KEY: ${JWT_KEY:-CI_Test_ToyStore_JWT_Secret_Key_2026_SuperSafe!}
      JWT_ISSUER: ToyStoreAPI
      JWT_AUDIENCE: ToyStoreClient
      JWT_EXPIRY_MINUTES: "60"
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ci_toystore_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ci_toystore_data:
